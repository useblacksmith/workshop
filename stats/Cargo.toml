[package]
name = "blacksmith-demo-stats"
version = "0.1.0"
edition = "2021"
description = "Vote statistics service for the Blacksmith-Demo workshop app"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[profile.release]
lto = true
